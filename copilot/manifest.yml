display_name: "Copilot"
description: "GitHub Copilot CLI configuration"
workspace_path: "/workspace"
home_path: "/home/agent"
user: "agent"
icon: "copilot-light.svg"
icon_dark: "copilot-dark.svg"
services:
  - "terminal|Copilot CLI|7681"
commands:
  - set_provider: "/usr/local/bin/set-provider.sh $baseUrl $modelName $apiKey $providerName $providerType"
  - set_git_proxy: "/usr/local/bin/set-git-proxy.sh $downloadUrl"
  - add_mcp_server: "/usr/local/bin/add-mcp-server.sh $name $url $transport $authHeader"
  - remove_mcp_server: "/usr/local/bin/remove-mcp-server.sh $name"
  - add_skill: "/usr/local/bin/add-skill.sh $source"
  - remove_skill: "/usr/local/bin/remove-skill.sh $name"
  - start_agent: "/usr/local/bin/start-agent.sh"
  - stop_agent: "/usr/local/bin/stop-agent.sh"
