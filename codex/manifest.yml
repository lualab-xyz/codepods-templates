display_name: "Codex"
description: "OpenAI Codex CLI configuration"
workspace_path: "/workspace"
home_path: "/home/agent"
user: "agent"
icon: "codex-light.svg"
icon_dark: "codex-dark.svg"
services:
  - "terminal|Codex CLI|7681"
commands:
  - set_provider: "/usr/local/bin/set-provider.sh $baseUrl $modelName $apiKey $providerName $providerType"
  - set_git_proxy: "/usr/local/bin/set-git-proxy.sh $downloadUrl"
  - add_mcp_server: "/usr/local/bin/add-mcp-server.sh $name $url $transport $authHeader"
  - remove_mcp_server: "/usr/local/bin/remove-mcp-server.sh $name"
  - get_mcps: "/usr/local/bin/get-mcps.sh"
  - add_skill: "/usr/local/bin/add-skill.sh $name $source"
  - remove_skill: "/usr/local/bin/remove-skill.sh $name"
  - get_skills: "/usr/local/bin/get-skills.sh"
  - start_agent: "/usr/local/bin/start-agent.sh"
  - stop_agent: "/usr/local/bin/stop-agent.sh"
# Shared base image used by this template's Dockerfile (FROM <name>).
# The orchestrator builds this image first from repository/folder/dockerfile
# and may rewrite the FROM line to another image chosen at deploy time.
image_base:
  name: "codepods-ubuntu24:latest"
  repository: "https://github.com/lualab-xyz/codepods-templates.git"
  folder: "ubuntu24"
  dockerfile: "Dockerfile"
