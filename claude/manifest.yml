display_name: "Claude Code"
description: "Anthropic Claude Code CLI configuration"
workspace_path: "/workspace"
home_path: "/home/agent"
user: "agent"
icon: "claude-light.svg"
icon_dark: "claude-dark.svg"
services:
  - "terminal|Claude Code|7681"
commands:
  - set_git_proxy: "/usr/local/bin/set-git-proxy.sh $downloadUrl"
  - add_mcp_server: "/usr/local/bin/add-mcp-server.sh $name $url $transport $authHeader"
  - start_agent: "/usr/local/bin/start-agent.sh"
  - stop_agent: "/usr/local/bin/stop-agent.sh"
# Shared base image used by this template's Dockerfile (FROM <name>).
# The orchestrator builds this image first from repository/folder/dockerfile
# and may rewrite the FROM line to another image chosen at deploy time.
image_base:
  name: "codepods-ubuntu24:latest"
  repository: "https://github.com/lualab-xyz/codepods-templates.git"
  folder: "ubuntu24"
  dockerfile: "Dockerfile"
